[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smda"
version = "0.1.0"
description = "Symbolic Mechanistic Data Attribution: research release candidate"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Reza Habibi"}, {name = "Darian Lee"}, {name = "Magy Seif El-Nasr"}]
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<1.8", "pyarrow>=15"]

[project.optional-dependencies]
llm = ["torch>=2.2", "transformers>=4.44,<4.57", "accelerate>=0.33", "safetensors>=0.4", "huggingface-hub>=0.25,<1"]
train = ["bitsandbytes>=0.43; sys_platform == 'linux'"]
test = ["pytest>=8,<9", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
